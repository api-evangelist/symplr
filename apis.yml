aid: symplr
name: symplr
description: >-
  symplr (symplr software LLC, Houston) sells healthcare operations software to hospitals, health systems and
  payers: provider data management and credentialing (symplr Provider, Directory, CVO, Payer), workforce and
  talent management (Smart Square, symplr Workforce, formerly API Healthcare), quality and safety (Midas),
  clinical communications, spend, access, contract and compliance management, unified as the symplr Operations
  Platform. It markets APIs, webhooks and a certified partner program, but publishes no public API reference or
  machine-readable contract.
