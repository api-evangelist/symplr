x-disambiguation: >-
  This repo profiles symplr, the healthcare operations software company (www.symplr.com). It is NOT Symplr.io
  (symplr.io, docs.symplr.io, arazzo-editor.symplr.io — an AI app builder that also runs the "Workflow Builder for
  Arazzo"), an unrelated company that shares the name. Symplr.io links its own name to 101studio.co, lists
  contact@symplr.io, runs on separate DNS (Route 53) and mail (GoDaddy), and neither site links to the other,
  so the Arazzo editor is not credited here. Halo Health, a symplr acquisition, has its own profile at all/halo-health-symplr.
